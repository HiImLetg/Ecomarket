<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoMarket | Productos ecológicos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link href="css/accesibilidad.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Navegación principal">
      <div class="container">
        <a class="navbar-brand" href="#inicio">EcoMarket</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
                aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="#catalogo-seccion">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="contenido" tabindex="-1">

    <!-- HERO (Miembro 2) -->
    <section id="inicio" class="py-5">
      <div class="container">
        <h1>EcoMarket</h1>
        <p>Productos ecológicos para un estilo de vida sostenible.</p>
        <a class="btn btn-success" href="#catalogo-seccion">Ver catálogo</a>
      </div>
    </section>

    <!-- CATÁLOGO (Miembro 2 diseño, Miembro 3 lógica) -->
    <section id="catalogo-seccion" class="py-5">
      <div class="container">
        <h2>Catálogo</h2>

        <div class="row g-3 mb-4">
          <div class="col-md-8">
            <label for="buscador" class="form-label">Buscar productos</label>
            <input type="search" id="buscador" class="form-control" placeholder="Ej: botella">
          </div>
          <div class="col-md-4">
            <label for="filtro-categoria" class="form-label">Categoría</label>
            <select id="filtro-categoria" class="form-select">
              <option value="todas">Todas</option>
            </select>
          </div>
        </div>

        <div id="catalogo" class="row g-4" aria-live="polite"></div>
        <p id="sin-resultados" class="d-none">No se encontraron productos.</p>
      </div>
    </section>

    <!-- CONTACTO (Miembro 2) -->
    <section id="contacto" class="py-5">
      <div class="container">
        <h2>Contacto</h2>
        <p>Aquí irá el formulario y los datos de contacto.</p>
      </div>
    </section>

  </main>

  <footer class="py-4">
    <div class="container">
      <p class="mb-0">&copy; 2026 EcoMarket</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
